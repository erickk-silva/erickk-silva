<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="187" viewBox="0 0 1200 187" role="img" aria-label="Selected toolkit for web, mobile, backend, and automation">
<title>Selected toolkit for web, mobile, backend, and automation</title><desc>Technologies: React, React Native, TypeScript, Kotlin, PHP, Laravel, SQL, Docker, ESP32, GitHub Actions and AI.</desc><defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080A15"/>
    <stop offset=".56" stop-color="#0C1022"/>
    <stop offset="1" stop-color="#070B16"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B088FF"/>
    <stop offset=".43" stop-color="#668BFF"/>
    <stop offset=".72" stop-color="#53BCFF"/>
    <stop offset="1" stop-color="#BEFF65"/>
  </linearGradient>
  <linearGradient id="aqua" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#4359FF"/>
    <stop offset=".58" stop-color="#4AB6FF"/>
    <stop offset="1" stop-color="#A8FBD6"/>
  </linearGradient>
  <linearGradient id="lime" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#46CDB7"/>
    <stop offset=".55" stop-color="#A2F975"/>
    <stop offset="1" stop-color="#D1FF72"/>
  </linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#A780FF"/>
    <stop offset=".55" stop-color="#6E7FFF"/>
    <stop offset="1" stop-color="#469DFF"/>
  </linearGradient>
  <radialGradient id="purpleGlow"><stop stop-color="#7340D9" stop-opacity=".48"/><stop offset="1" stop-color="#7340D9" stop-opacity="0"/></radialGradient>
  <radialGradient id="blueGlow"><stop stop-color="#2D7CFE" stop-opacity=".30"/><stop offset="1" stop-color="#2D7CFE" stop-opacity="0"/></radialGradient>
  <radialGradient id="limeGlow"><stop stop-color="#9FE66D" stop-opacity=".22"/><stop offset="1" stop-color="#9FE66D" stop-opacity="0"/></radialGradient>
  <pattern id="mesh" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#29334C" stroke-opacity=".4" stroke-width=".8"/></pattern>
  <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="#7992C9" fill-opacity=".24"/></pattern>
</defs><style>
  text{font-family:Inter,'Inter Display','Segoe UI',Arial,sans-serif}
  .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
  .orbit{transform-origin:975px 232px;animation:spin 28s linear infinite}
  .orbit-reverse{transform-origin:975px 232px;animation:spin 36s linear infinite reverse}
  .float{animation:float 5s ease-in-out infinite}
  .float-delay{animation:float 7s ease-in-out infinite reverse}
  .pulse{animation:pulse 3.4s ease-in-out infinite}
  .pulse-delay{animation:pulse 5s ease-in-out infinite reverse}
  .flow{stroke-dasharray:10 11;animation:dash 5s linear infinite}
  .scan{animation:scan 7s ease-in-out infinite}
  .wave{animation:wave 6s ease-in-out infinite}
  .fade-in{animation:fadein .9s ease-out both}
  @keyframes spin {to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-9px)}}
  @keyframes pulse{0%,100%{opacity:.48}50%{opacity:1}}
  @keyframes dash{to{stroke-dashoffset:-126}}
  @keyframes scan{0%,100%{transform:translateX(0px);opacity:.4}50%{transform:translateX(160px);opacity:.8}}
  @keyframes wave{0%,100%{opacity:.46}50%{opacity:.95}}
  @keyframes fadein{0%{opacity:0}100%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.orbit,.orbit-reverse,.float,.float-delay,.pulse,.pulse-delay,.flow,.scan,.wave,.fade-in{animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="185" rx="25" fill="url(#background)" stroke="#29314B" stroke-width="1.4"/>

<rect x="1" y="1" width="1198" height="185" rx="25" fill="url(#mesh)" opacity=".22"/>
<rect x="49" y="34" width="4" height="117" rx="2" fill="url(#accent)"/>
<text x="71" y="60" font-size="11" letter-spacing="2.7" fill="#A3AFC9" font-weight="700">SELECTED TOOLKIT</text>
<text x="70" y="105" font-size="29" font-weight="770" fill="#F4F7FF" letter-spacing="-.8">Built to solve,</text>
<text x="70" y="136" font-size="29" font-weight="770" fill="url(#accent)" letter-spacing="-.8">not to decorate.</text>
<line x1="382" x2="382" y1="33" y2="155" stroke="#2E3854"/>
<line x1="656" x2="656" y1="33" y2="155" stroke="#2E3854"/>
<line x1="930" x2="930" y1="33" y2="155" stroke="#2E3854"/>
<text x="410" y="56" font-size="11" font-weight="780" fill="#B29AFF" letter-spacing="1.8" >FRONTEND / MOBILE</text>
<text x="410" y="89" font-size="17" font-weight="680" fill="#ECF1FF">React · React Native</text>
<text x="410" y="118" font-size="17" font-weight="650" fill="#B8C5E0">TypeScript · Kotlin</text>
<text x="684" y="56" font-size="11" font-weight="780" fill="#77B9FF" letter-spacing="1.8" >BACKEND / DATA</text>
<text x="684" y="89" font-size="17" font-weight="680" fill="#ECF1FF">PHP · Laravel · SQL</text>
<text x="684" y="118" font-size="17" font-weight="650" fill="#B8C5E0">APIs · Integration</text>
<text x="956" y="56" font-size="11" font-weight="780" fill="#C4FF80" letter-spacing="1.8" >SYSTEMS / TOOLS</text>
<text x="956" y="89" font-size="17" font-weight="680" fill="#ECF1FF">Docker · ESP32</text>
<text x="956" y="118" font-size="17" font-weight="650" fill="#B8C5E0">GitHub Actions · AI</text>
<circle cx="1139" cy="145" r="5.2" fill="#BFFF6B" class="pulse"/>

</svg>