 <text x="949" y="113" fill="#A5B7D6" font-size="9.5" font-weight="650" letter-spacing=".7">TODAY'S FOCUS</text>
 <circle cx="998" cy="168" r="43" fill="none" stroke="#273851" stroke-width="8"/>
 <circle cx="998" cy="168" r="43" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="8" stroke-dasharray="173 270" transform="rotate(-90 998 168)"/>
 <circle cx="998" cy="168" r="29" fill="#182138"/>
 <path d="M989 167l7 7 13-16" fill="none" stroke="#C0FF7F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
