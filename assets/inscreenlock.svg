 <circle cx="960" cy="245" r="4" fill="#BDFF76"/>
 <text x="971" y="248.5" fill="#CDE2EC" font-size="11" font-weight="650">LOCAL FIRST</text>
</g>
<path d="M815 149L907 149" stroke="#A787FF" stroke-opacity=".54" class="flow"/>
<rect x="777" y="119" width="126" height="53" rx="11" fill="#18172E" stroke="#8467CC" stroke-opacity=".7"/>
<circle cx="798" cy="146" r="5.7" fill="#A985FF"/>
<text x="811" y="142" font-size="11" fill="#F0E9FF" font-weight="700">PRIVACY</text>
<text x="811" y="155" font-size="9.4" fill="#A79CC9">BY DEFAULT</text>
<rect x="1077" y="204" width="100" height="51" rx="11" fill="#122C2A" stroke="#6CC69A" stroke-opacity=".55"/>
<path d="M1096 225l6 6 11-12" stroke="#C2FF77" fill="none" stroke-width="2.5" stroke-linecap="round"/>
<text x="1120" y="229" font-size="10" fill="#CAFFA0" font-weight="700">OFFLINE</text>
<circle cx="881" cy="217" r="7" fill="#17172B" stroke="#B4FF70" stroke-width="2" class="pulse-delay"/>

</svg>