<text x="52" y="111" fill="#F4F7FF" font-size="58" font-weight="780" letter-spacing="-2.2">SeeMe<tspan fill="#C5FF79">.</tspan></text>
<text x="52" y="157" fill="#8FBFFF" font-size="25" font-weight="670" letter-spacing="-.35">Computer vision for human interaction</text>
<text x="52" y="195" fill="#BBC9DE" font-size="18">Collaborative work on gesture recognition, CNN training</text>
<text x="52" y="219" fill="#BBC9DE" font-size="18">experiments and accessible interaction features.</text>
