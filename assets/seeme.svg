<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="304" viewBox="0 0 1200 304" role="img" aria-label="SeeMe — collaborative accessibility and computer vision project">
<title>SeeMe — applied computer vision for accessibility</title>
<desc>Collaborative project exploring accessible computer interaction, hand gestures and LIBRAS recognition. Contributed to CNN model training experiments and integration; basic fine-tuning foundations.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B17"/><stop offset=".6" stop-color="#0B1324"/><stop offset="1" stop-color="#07101B"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8F81FE"/><stop offset=".5" stop-color="#6BBDFB"/><stop offset="1" stop-color="#BBFF7A"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#2B9CB9" stop-opacity=".26"/><stop offset="1" stop-color="#2B9CB9" stop-opacity="0"/></radialGradient>
<pattern id="mesh" width="29" height="29" patternUnits="userSpaceOnUse"><path d="M29 0H0V29" fill="none" stroke="#344059" opacity=".25"/></pattern>
</defs>
<style>text{font-family:Inter,'Segoe UI',Arial,sans-serif}.breath{animation:breath 4s ease-in-out infinite}.dash{stroke-dasharray:6 11;animation:run 12s linear infinite}@keyframes breath{0%,100%{opacity:.40}50%{opacity:1}}@keyframes run{to{stroke-dashoffset:-204}}@media(prefers-reduced-motion:reduce){.breath,.dash{animation:none!important}}</style>
<rect x="1" y="1" width="1198" height="302" rx="25" fill="url(#bg)" stroke="#2B3652" stroke-width="1.4"/>
