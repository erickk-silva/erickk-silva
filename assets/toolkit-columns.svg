<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="Engineering toolkit: four vertical sculpted pillars for product, backend, applied AI and delivery">
<title>Engineering toolkit — four disciplines, one engineering practice</title>
<desc>Isometric architectural columns for product interfaces, backend services, AI and vision, and delivery. Four vertically separated engineering disciplines, animated light traces, purple, blue, lime and teal. Each pillar lists grounded technology experience.</desc>
<defs>
<linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090C18"/><stop offset=".58" stop-color="#0B1223"/><stop offset="1" stop-color="#070B16"/></linearGradient>
<linearGradient id="headline" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B9A5FF"/><stop offset=".45" stop-color="#7AAEFF"/><stop offset="1" stop-color="#C8FF7A"/></linearGradient>
<pattern id="calibration" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#607090" stroke-width=".7" stroke-opacity=".14" fill="none"/></pattern>
<linearGradient id="silhouette" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF" stop-opacity=".08"/><stop offset=".44" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/></linearGradient>
<filter id="shadow" x="-25%" y="-20%" width="150%" height="160%"><feGaussianBlur stdDeviation="15"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>
text{font-family:'Inter','Segoe UI',Arial,sans-serif}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
.light{animation:scan 9s cubic-bezier(.43,.07,.57,.94) infinite}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.trace{animation:trace 8s linear infinite}
.float{animation:float 7s ease-in-out infinite}
@keyframes scan{0%,11%{transform:translateY(-190px);opacity:0}19%{opacity:.8}66%{opacity:.55}76%,100%{transform:translateY(370px);opacity:0}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes trace{to{stroke-dashoffset:-160}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.light,.pulse,.trace,.float{animation:none!important}}
</style>
